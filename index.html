<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude, live</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='5' fill='%2334d399'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #060a13;
  --card: #0f182a;
  --card-hi: #142037;
  --border: rgba(148, 163, 184, .13);
  --border-hi: rgba(148, 163, 184, .28);
  --text: #e7edf6;
  --text-2: #aab6c8;
  --text-3: #7d8a9f;
  --work: #34d399;
  --turn: #fbbf24;
  --need: #fb7185;
  --bad: #f43f5e;
  --warn: #fb923c;
  --wait: #60a5fa;
  --wf: #a78bfa;
  --done: #64748b;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
  --rail: 0px;
  --dock: 0px;
  --side: #070d19;
  --panel: min(max(460px, var(--rail)), 100vw);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 13px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(48% 78% at 4% -14%, rgba(52, 211, 153, .085), transparent 70%),
    radial-gradient(42% 64% at 46% -20%, rgba(167, 139, 250, .055), transparent 70%),
    radial-gradient(48% 80% at 86% -10%, rgba(96, 165, 250, .08), transparent 70%),
    radial-gradient(38% 52% at 22% 78%, rgba(56, 189, 248, .035), transparent 70%),
    radial-gradient(40% 56% at 70% 70%, rgba(167, 139, 250, .03), transparent 70%),
    radial-gradient(rgba(148, 163, 184, .07) 1px, transparent 1.3px) 0 0 / 22px 22px;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }

/* full-screen canvas and floating chrome */
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
.sb { position: fixed; z-index: 19; border-radius: 999px; background: rgba(148, 163, 184, .08); }
.sb-x { bottom: calc(var(--dock) + 4px); height: 6px; }
.sb-y { width: 6px; }
.sb-thumb { position: absolute; left: 0; top: 0; border-radius: 999px; background: rgba(148, 163, 184, .38); cursor: grab; transition: background .15s; }
.sb-x .sb-thumb { height: 100%; }
.sb-y .sb-thumb { width: 100%; }
.sb-thumb.glide { transition: transform .6s cubic-bezier(.2, .8, .2, 1), background .15s; }
.sb:hover .sb-thumb, .sb.on .sb-thumb { background: rgba(148, 163, 184, .62); }
.sb.on .sb-thumb { cursor: grabbing; }
.viewport { position: fixed; inset: 0 var(--rail) var(--dock) 0; overflow: hidden; touch-action: none; }
.viewport.dragging, .viewport.dragging * { cursor: grabbing !important; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.world.glide { transition: transform .6s cubic-bezier(.2, .8, .2, 1); }
.float {
  position: fixed;
  z-index: 20;
  background: rgba(9, 15, 27, .8);
  border: 1px solid var(--border);
  backdrop-filter: blur(10px);
  box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
}
.hud {
  left: 16px;
  bottom: calc(var(--dock) + 14px);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 13px;
  border-radius: 999px;
  font-size: 12px;
  color: var(--text-3);
  white-space: nowrap;
  max-width: calc(100vw - var(--rail) - 384px);
  overflow: hidden;
  text-overflow: ellipsis;
}
@media (min-width: 641px) { body.panel-open .hud { max-width: calc(100vw - var(--panel) - 384px); } }
.hud b { font: 600 12px var(--mono); color: var(--text); margin-right: 4px; }
.hud .k-work b { color: var(--work); }
.hud .k-need b { color: var(--need); }
.hud .k-bad b { color: var(--bad); }
.hud .dot { opacity: .4; }
.mark { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--work); box-shadow: 0 0 0 3px rgba(52, 211, 153, .16), 0 0 12px rgba(52, 211, 153, .7); }
.mark.off { background: var(--warn); box-shadow: 0 0 0 3px rgba(251, 146, 60, .16); }
.ctrl { right: calc(var(--rail) + 16px); bottom: calc(var(--dock) + 14px); transition: right .28s cubic-bezier(.2, .8, .2, 1); display: flex; gap: 8px; padding: 0; background: none; border: 0; box-shadow: none; backdrop-filter: none; }
.ctrl button, .ctrl .grp {
  height: 30px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: rgba(9, 15, 27, .82);
  backdrop-filter: blur(10px);
  color: var(--text-2);
  font-size: 12.5px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
}
.ctrl button { padding: 0 11px; cursor: pointer; transition: color .15s, border-color .15s, background .15s; }
.ctrl button:hover { color: var(--text); border-color: var(--border-hi); }
.ctrl button:focus-visible { outline: 2px solid var(--wait); outline-offset: 2px; }
.ctrl button[aria-pressed="true"] { color: var(--work); border-color: rgba(52, 211, 153, .45); background: rgba(52, 211, 153, .1); }
.ctrl .grp { display: flex; padding: 0; overflow: hidden; }
.ctrl .grp button { border: 0; border-radius: 0; background: none; box-shadow: none; backdrop-filter: none; min-width: 32px; }
.ctrl .grp button + button { border-left: 1px solid var(--border); }
.ctrl .grp button.pct { min-width: 54px; font: 500 12px var(--mono); }
.banner {
  top: 14px;
  left: 16px;
  max-width: min(620px, calc(100vw - 460px));
  padding: 9px 14px;
  border-radius: 10px;
  border-color: rgba(244, 63, 94, .55);
  background: rgba(60, 12, 24, .9);
  color: #ffd3db;
  font-weight: 550;
}
body.has-rail .banner { max-width: min(620px, calc(100vw - var(--rail) - 40px)); }
body.panel-open .ctrl { right: calc(var(--panel) + 16px); }
.banner.warn { border-color: rgba(251, 146, 60, .55); background: rgba(58, 30, 10, .9); color: #ffe1c7; }
.alerts {
  top: 14px;
  right: 16px;
  width: min(410px, calc(100vw - 32px));
  border-radius: 14px;
  overflow: hidden;
  transition: right .28s cubic-bezier(.2, .8, .2, 1);
}
body.panel-open .alerts { right: calc(var(--panel) + 16px); }
.al-head {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 9px 12px 9px 14px;
  border: 0;
  background: none;
  cursor: pointer;
  font-weight: 600;
  font-size: 12.5px;
  color: var(--text);
  text-align: left;
}
.al-head .n { font: 600 11px/1.6 var(--mono); padding: 0 7px; border-radius: 999px; background: rgba(244, 63, 94, .18); color: #ff9fb0; }
.al-head .n.need { background: rgba(251, 113, 133, .2); color: #ffb3c0; }
.al-head .chev { margin-left: auto; color: var(--text-3); transition: transform .2s; }
.alerts.closed .chev { transform: rotate(-90deg); }
.alerts.closed .al-list, .alerts.closed .al-more { display: none; }
.alerts.closed { width: auto; }
.al-list { list-style: none; margin: 0; padding: 0 6px 6px; max-height: 46vh; overflow-y: auto; }
.al {
  position: relative;
  display: block;
  padding: 7px 10px 7px 14px;
  border-radius: 8px;
  cursor: pointer;
}
.al::before { content: ''; position: absolute; left: 4px; top: 9px; bottom: 9px; width: 3px; border-radius: 2px; background: var(--c); }
.al.needs { --c: var(--need); }
.al.error { --c: var(--bad); }
.al.warn { --c: var(--warn); }
.al:hover, .al:focus-visible { background: rgba(255, 255, 255, .05); outline: none; }
.al .what { font-size: 12.5px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.al .why { font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.al.error .why { color: #ffb8c3; }
.al.needs .why { color: #ffc6cf; }
.al.warn .why { color: #ffd6b5; }
.al .where { font-size: 11.5px; color: var(--text-3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.al .where .tm { font-family: var(--mono); }
.al-more { display: block; width: 100%; padding: 6px 10px; border: 0; background: none; color: var(--text-3); font-size: 12px; cursor: pointer; text-align: left; border-radius: 8px; }
.al-more:hover { color: var(--text); background: rgba(255, 255, 255, .04); }

/* board */
.lane {
  position: absolute;
  left: 0;
  top: 0;
  border-radius: 16px;
  background: linear-gradient(180deg, rgba(16, 26, 44, .76), rgba(9, 15, 27, .76));
  border: 1px solid var(--border);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .03), 0 14px 34px rgba(0, 0, 0, .3);
  transition: transform .55s cubic-bezier(.2, .8, .2, 1), width .5s cubic-bezier(.2, .8, .2, 1), height .5s cubic-bezier(.2, .8, .2, 1), opacity .35s, box-shadow .4s;
}
.lane::before {
  content: '';
  position: absolute;
  left: 18px;
  right: 18px;
  top: -1px;
  height: 2px;
  border-radius: 2px;
  background: var(--c);
  opacity: .8;
  box-shadow: 0 0 14px var(--c);
}
.lane.entering { animation: laneIn .9s ease-out; }
.lane.leaving { opacity: 0; pointer-events: none; }
.lane.flash { box-shadow: 0 0 0 2px var(--wait), 0 0 34px rgba(96, 165, 250, .35); }
@keyframes laneIn { 0% { opacity: 0; } 40% { opacity: 1; box-shadow: 0 0 0 2px var(--c), 0 0 40px var(--c); } }
.canvas { position: relative; width: 100%; height: 100%; }
.links { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }

/* state colours */
.c-working, .c-running { --c: var(--work); }
.c-your-turn { --c: var(--turn); }
.c-needs-you { --c: var(--need); }
.c-error, .c-retrying, .c-died, .c-failed, .c-lost { --c: var(--bad); }
.c-waiting { --c: var(--wait); }
.c-stalled { --c: var(--warn); }
.c-wf { --c: var(--wf); }
.c-done, .c-stopped, .c-ended, .c-completed { --c: var(--done); }
.c-more { --c: var(--text-3); }

/* nodes */
.node {
  position: absolute;
  left: 0;
  top: 0;
  transition: transform .55s cubic-bezier(.2, .8, .2, 1), opacity .4s ease;
}
.node.new { opacity: 0; }
.node.leaving { opacity: 0; pointer-events: none; }
.node:focus-visible { outline: none; }
.node:focus-visible > * { outline: 2px solid var(--wait); outline-offset: 2px; }
.card {
  position: relative;
  height: 100%;
  border-radius: 12px;
  background: var(--card);
  border: 1px solid var(--border);
  padding: 9px 12px 9px 15px;
  overflow: hidden;
  cursor: pointer;
  transition: border-color .2s, background .2s, opacity .25s, box-shadow .3s;
}
.card::before, .shell::before {
  content: '';
  position: absolute;
  left: 0;
  top: 9px;
  bottom: 9px;
  width: 3px;
  border-radius: 0 3px 3px 0;
  background: var(--c);
}
.card:hover { border-color: var(--border-hi); background: var(--card-hi); }
.c-working > .card, .c-running > .card { border-color: rgba(52, 211, 153, .3); box-shadow: 0 0 22px rgba(52, 211, 153, .07); }
.c-wf > .card { border-color: rgba(167, 139, 250, .35); box-shadow: 0 0 22px rgba(167, 139, 250, .07); }
.c-waiting > .card { border-color: rgba(96, 165, 250, .32); }
.c-your-turn > .card { border-color: rgba(251, 191, 36, .3); }
.c-stalled > .card { border-color: rgba(251, 146, 60, .5); }
.c-needs-you > .card { border-color: rgba(251, 113, 133, .65); animation: alarm 1.6s ease-in-out infinite; }
.c-retrying > .card { border-color: rgba(244, 63, 94, .65); animation: alarmBad 1.2s ease-in-out infinite; }
.c-failed > .card, .c-died > .card, .c-error > .card, .c-lost > .card {
  border-color: rgba(244, 63, 94, .45);
  background: linear-gradient(180deg, rgba(244, 63, 94, .1), rgba(244, 63, 94, .03)), var(--card);
}
.c-done > .card, .c-stopped > .card, .c-ended > .card { opacity: .66; }
.c-done > .card:hover, .c-stopped > .card:hover, .c-ended > .card:hover { opacity: 1; }
@keyframes alarm { 50% { box-shadow: 0 0 0 3px rgba(251, 113, 133, .2), 0 0 26px rgba(251, 113, 133, .32); } }
@keyframes alarmBad { 50% { box-shadow: 0 0 0 3px rgba(244, 63, 94, .22), 0 0 26px rgba(244, 63, 94, .35); } }
.node.sel > * { border-color: var(--wait) !important; box-shadow: 0 0 0 1px var(--wait), 0 0 26px rgba(96, 165, 250, .25); }
.node.flash > * { animation: flash 1.6s ease-out; }
@keyframes flash { 0%, 40% { box-shadow: 0 0 0 3px var(--wait), 0 0 34px rgba(96, 165, 250, .55); } }

.card .hd { display: flex; align-items: center; gap: 8px; min-width: 0; }
.ttl { flex: 1; min-width: 0; font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.session .ttl { font-size: 14.5px; }
.rt { flex: none; font: 500 11px var(--mono); color: var(--text-3); font-variant-numeric: tabular-nums; }
.chip {
  flex: none;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .05em;
  text-transform: uppercase;
  padding: 2px 7px;
  border-radius: 999px;
  color: var(--c);
  background: rgba(148, 163, 184, .1);
  background: color-mix(in srgb, var(--c) 15%, transparent);
  border: 1px solid color-mix(in srgb, var(--c) 38%, transparent);
}
.badge { flex: none; font-size: 10px; color: var(--text-3); border: 1px solid var(--border-hi); border-radius: 5px; padding: 0 5px; text-transform: uppercase; letter-spacing: .05em; }
.act { display: flex; gap: 8px; align-items: baseline; margin-top: 5px; font: 12px/1.35 var(--mono); color: var(--c); min-width: 0; }
.act .tx { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.act .tm { flex: none; color: var(--text-3); }
.act .k { color: var(--text-3); }
.act.wrap .tx { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.38; }
.c-done .act, .c-stopped .act, .c-ended .act { color: var(--text-2); }
.line { margin-top: 5px; color: var(--text-2); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.line .k { color: var(--text-3); margin-right: 6px; }
.meta { margin-top: 4px; color: var(--text-3); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta i { font-style: normal; opacity: .5; padding: 0 6px; }
.foot { display: flex; align-items: flex-end; gap: 10px; margin-top: 9px; }
.spark { flex: 1; display: flex; align-items: flex-end; gap: 2px; height: 18px; }
.spark b { flex: 1; background: var(--c); opacity: .5; border-radius: 1px; min-height: 2px; }
.spark.quiet b { opacity: .16; }
.cnt { flex: none; font-size: 11.5px; color: var(--text-3); white-space: nowrap; }
.bar { height: 4px; border-radius: 2px; background: rgba(148, 163, 184, .16); margin-top: 8px; overflow: hidden; }
.bar b { display: block; height: 100%; background: var(--c); border-radius: 2px; transition: width .5s; }

.shell {
  position: relative;
  display: flex;
  align-items: center;
  gap: 8px;
  height: 100%;
  padding: 0 10px 0 13px;
  border-radius: 9px;
  background: rgba(15, 24, 42, .92);
  border: 1px solid var(--border);
  font: 11.5px var(--mono);
  color: var(--text-2);
  cursor: pointer;
  transition: border-color .2s, background .2s, opacity .25s;
}
.shell::before { top: 7px; bottom: 7px; width: 2px; }
.shell:hover { border-color: var(--border-hi); background: var(--card-hi); }
.shell .tx { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shell .tm { flex: none; color: var(--text-3); }
.shell .si { color: var(--c); }
.c-failed > .shell, .c-died > .shell { border-color: rgba(244, 63, 94, .45); color: #ffc0ca; }
.c-failed > .shell .tm, .c-died > .shell .tm { color: var(--bad); }
.c-done > .shell, .c-stopped > .shell, .c-ended > .shell { opacity: .58; }
.c-running > .shell { border-color: rgba(52, 211, 153, .22); }
.more {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  border-radius: 9px;
  border: 1px dashed var(--border-hi);
  color: var(--text-2);
  font-size: 12px;
  cursor: pointer;
  transition: background .2s, color .2s;
}
.more:hover { background: rgba(255, 255, 255, .04); color: var(--text); }

/* status icons */
.si { flex: none; width: 14px; height: 14px; color: var(--c); display: block; overflow: visible; }
.si.spin { animation: spin 1s linear infinite; }
.si.slow { animation: spin 3.2s linear infinite; }
.si .blink { animation: blink 1.1s steps(2, start) infinite; }
.si .ring { transform-origin: 8px 8px; animation: ring 1.6s ease-out infinite; }
.si.hit { animation: hit .45s ease-out; }
.beat { animation: beat .7s ease-out; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes blink { to { opacity: .25; } }
@keyframes ring { from { transform: scale(.6); opacity: .9; } to { transform: scale(1.7); opacity: 0; } }
@keyframes hit { 50% { transform: scale(1.5); filter: drop-shadow(0 0 4px var(--c)); } }
@keyframes beat { from { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c) 55%, transparent); } to { box-shadow: 0 0 0 14px transparent; } }

/* links */
.ln { fill: none; stroke: var(--c); stroke-opacity: .42; stroke-width: 1.6; transition: stroke-opacity .25s, stroke-width .25s; }
.ln.on { stroke-opacity: .85; stroke-dasharray: 5 6; animation: flow .9s linear infinite; }
.ln.bad { stroke-opacity: .75; stroke-dasharray: 2 4; }
.ln.quiet { stroke-opacity: .2; }
@keyframes flow { to { stroke-dashoffset: -22; } }
.pulse { fill: var(--c); filter: drop-shadow(0 0 5px var(--c)); }
.lane.hovering .node { opacity: .32; }
.lane.hovering .node.lit { opacity: 1; }
.lane.hovering .ln { stroke-opacity: .06; }
.lane.hovering .ln.lit { stroke-opacity: .95; stroke-width: 2; }

/* panel */
.panel {
  position: fixed;
  z-index: 30;
  top: 0;
  right: 0;
  bottom: 0;
  width: var(--panel);
  padding: 16px 20px 32px;
  background: #0a1120;
  border-left: 1px solid var(--border-hi);
  box-shadow: -24px 0 60px rgba(0, 0, 0, .5);
  overflow-y: auto;
  transform: translateX(104%);
  visibility: hidden;
  transition: transform .28s cubic-bezier(.2, .8, .2, 1), visibility 0s .28s;
}
.panel.open { transform: none; visibility: visible; transition: transform .28s cubic-bezier(.2, .8, .2, 1); }
.p-top { display: flex; align-items: center; justify-content: space-between; }
.p-kind { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
.p-x {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: transparent;
  cursor: pointer;
  font-size: 18px;
  line-height: 1;
  color: var(--text-2);
}
.p-x:hover { background: rgba(255, 255, 255, .05); color: var(--text); }
.p-title { margin: 8px 0 8px; font-size: 18px; line-height: 1.3; font-weight: 650; word-break: break-word; }
.p-state { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.p-reason { margin-top: 10px; padding: 9px 11px; border-radius: 9px; background: color-mix(in srgb, var(--c) 10%, transparent); border: 1px solid color-mix(in srgb, var(--c) 30%, transparent); color: var(--text); font-size: 12.5px; }
.p-sec { margin-top: 18px; }
.p-sec h3 { margin: 0 0 7px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); font-weight: 600; }
.p-now { display: flex; gap: 8px; align-items: baseline; font: 12.5px/1.45 var(--mono); color: var(--c); }
.p-now .tm { color: var(--text-3); flex: none; }
.p-text { color: var(--text-2); font-size: 12.5px; white-space: pre-wrap; word-break: break-word; max-height: 220px; overflow-y: auto; }
.p-grid { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 5px 12px; margin: 0; font-size: 12.5px; }
.p-grid dt { color: var(--text-3); }
.p-grid dd { margin: 0; color: var(--text); word-break: break-word; }
.p-grid a, .p-link { color: var(--wait); text-decoration: none; cursor: pointer; }
.p-grid a:hover, .p-link:hover { text-decoration: underline; }
.p-list { list-style: none; margin: 0; padding: 0; }
.p-list li { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 10px; padding: 4px 0; font-size: 12.5px; color: var(--text-2); border-bottom: 1px solid rgba(148, 163, 184, .07); }
.p-list li .t { font: 11.5px var(--mono); color: var(--text-3); }
.p-kids li { grid-template-columns: 16px minmax(0, 1fr) auto; align-items: center; cursor: pointer; border-radius: 6px; padding: 5px 6px; }
.p-kids li:hover { background: rgba(255, 255, 255, .04); }
.p-kids li .s { font-size: 11px; color: var(--text-3); }

.toasts { position: fixed; left: 16px; bottom: calc(var(--dock) + 56px); z-index: 40; display: flex; flex-direction: column; gap: 8px; max-width: min(420px, calc(100vw - 40px)); }
.toast {
  padding: 10px 14px;
  border-radius: 10px;
  background: #14203a;
  border: 1px solid var(--border-hi);
  box-shadow: 0 12px 30px rgba(0, 0, 0, .45);
  cursor: pointer;
  animation: toastIn .35s cubic-bezier(.2, .8, .2, 1);
  font-size: 12.5px;
}
.toast b { color: var(--text); }
.toast.bad { border-color: rgba(244, 63, 94, .55); }
@keyframes toastIn { from { opacity: 0; transform: translateY(10px); } }
.empty { position: fixed; inset: 0 var(--rail) var(--dock) 0; display: flex; align-items: center; justify-content: center; color: var(--text-3); font-size: 14px; pointer-events: none; }


/* the board's cards while a rail row points at them */
.node.touch > * { border-color: rgba(231, 237, 246, .72) !important; box-shadow: 0 0 0 1px rgba(231, 237, 246, .45), 0 0 26px rgba(231, 237, 246, .16); }

/* timeline dock */
.dock {
  position: fixed;
  left: 0;
  right: var(--rail);
  bottom: 0;
  height: var(--dock);
  z-index: 21;
  display: flex;
  flex-direction: column;
  background: linear-gradient(#08101f, #060b16);
  border-top: 1px solid var(--border-hi);
  box-shadow: 0 -14px 40px rgba(0, 0, 0, .35);
  transition: right .28s cubic-bezier(.2, .8, .2, 1);
}
body.panel-open .dock { right: var(--panel); }
body.resizing, body.resizing * { cursor: ns-resize !important; user-select: none; }
.dock-grip { position: absolute; left: 0; right: 0; top: -6px; height: 12px; cursor: ns-resize; z-index: 2; touch-action: none; }
.dock-grip::after { content: ''; position: absolute; left: 50%; top: 4px; width: 44px; height: 4px; margin-left: -22px; border-radius: 4px; background: rgba(148, 163, 184, .22); transition: background .15s; }
.dock-grip:hover::after, body.resizing .dock-grip::after { background: rgba(148, 163, 184, .6); }
.dock-head { flex: none; height: 38px; display: flex; align-items: center; gap: 10px; padding: 0 10px 0 16px; border-bottom: 1px solid var(--border); overflow: hidden; }
.dock.folded .dock-head { border-bottom: 0; }
.dock-head h2, .r-head h2 { margin: 0; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); font-weight: 650; white-space: nowrap; }
.seg { display: flex; flex: none; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
.seg button { height: 24px; padding: 0 9px; border: 0; background: none; color: var(--text-2); font: 500 11.5px var(--mono); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: rgba(96, 165, 250, .16); color: var(--text); }
.live-btn { flex: none; height: 26px; padding: 0 10px 0 9px; display: flex; align-items: center; gap: 6px; border-radius: 7px; border: 1px solid var(--border); background: none; color: var(--text-3); font-size: 11.5px; font-weight: 600; cursor: pointer; }
.live-btn::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); }
.live-btn[aria-pressed="true"] { color: var(--work); border-color: rgba(52, 211, 153, .4); }
.live-btn[aria-pressed="true"]::before { background: var(--work); box-shadow: 0 0 8px var(--work); animation: livePulse 1.6s ease-in-out infinite; }
.kinds { display: flex; gap: 2px; min-width: 0; overflow: hidden; }
.kinds button { flex: none; height: 26px; padding: 0 8px; display: flex; align-items: center; gap: 6px; border-radius: 7px; border: 1px solid transparent; background: none; color: var(--text-2); font-size: 11.5px; cursor: pointer; white-space: nowrap; }
.kinds button i { width: 9px; height: 9px; border-radius: 2px; background: var(--kc); }
.kinds button b { font: 600 11px var(--mono); color: var(--text); }
.kinds button:hover { border-color: var(--border); }
.kinds button[aria-pressed="false"] { color: var(--text-3); }
.kinds button[aria-pressed="false"] i { background: none; box-shadow: inset 0 0 0 1.5px var(--kc); }
.kinds button[aria-pressed="false"] b { color: var(--text-3); font-weight: 500; }
.tl-rate { margin-left: auto; display: flex; gap: 12px; font-size: 11.5px; color: var(--text-3); white-space: nowrap; }
.tl-rate b { font: 600 11.5px var(--mono); color: var(--text); margin-right: 4px; }
.tl-rate .bad b { color: #ff9fb0; }
.fold { flex: none; width: 28px; height: 26px; border-radius: 7px; border: 1px solid var(--border); background: none; color: var(--text-2); cursor: pointer; font-size: 11px; transition: transform .2s; }
.fold:hover { color: var(--text); border-color: var(--border-hi); }
.dock.folded .fold { transform: rotate(180deg); }
.dock button:focus-visible, .rail button:focus-visible, .rail li:focus-visible { outline: 2px solid var(--wait); outline-offset: 1px; }
.tl { position: relative; flex: 1 1 auto; min-height: 0; }
.dock.folded .tl { display: none; }
.tl canvas { position: absolute; left: 0; top: 0; display: block; cursor: crosshair; touch-action: none; }
.tl.dragging canvas { cursor: grabbing !important; }
.tl-empty { position: absolute; inset: 22px 0 0; display: flex; align-items: center; justify-content: center; color: var(--text-3); font-size: 12.5px; pointer-events: none; }
.tl-tip { position: absolute; left: 0; top: 0; z-index: 3; width: max-content; max-width: 380px; min-width: 230px; padding: 9px 11px; border-radius: 10px; background: rgba(13, 21, 38, .97); border: 1px solid var(--border-hi); box-shadow: 0 14px 40px rgba(0, 0, 0, .55); pointer-events: none; font-size: 12px; }
.tt-h { display: flex; align-items: center; gap: 7px; font-weight: 600; color: var(--text); }
.sw { width: 9px; height: 9px; border-radius: 2px; flex: none; display: inline-block; }
.tt-s { margin-left: auto; padding-left: 10px; font: 600 11px/18px var(--mono); padding: 0 6px; border-radius: 5px; white-space: nowrap; }
.tt-s.ok { color: var(--work); background: rgba(52, 211, 153, .12); }
.tt-s.bad { color: #ff9fb0; background: rgba(244, 63, 94, .16); }
.tt-s.open { color: var(--wait); background: rgba(96, 165, 250, .14); }
.tt-s.cut { color: var(--warn); background: rgba(251, 146, 60, .14); }
.tt-l { margin-top: 6px; color: var(--text); line-height: 1.4; }
.tt-r { margin-top: 5px; display: flex; gap: 6px; align-items: flex-start; font: 11.5px/1.4 var(--mono); color: var(--text-2); word-break: break-all; }
.tt-r svg { width: 13px; height: 13px; flex: none; margin-top: 1px; color: var(--text-3); }
.tt-w { margin-top: 5px; color: var(--text-2); font-size: 11.5px; }
.who-sep { margin: 0 5px; color: var(--text-3); }
.tt-t { margin-top: 2px; color: var(--text-3); font: 11px var(--mono); }
.tt-e { margin-top: 6px; padding: 6px 8px; border-radius: 6px; background: rgba(244, 63, 94, .1); color: #ffc2cc; font: 11.5px/1.4 var(--mono); word-break: break-word; }
.tt-hint { margin-top: 6px; color: var(--text-3); font-size: 11px; }

/* right column: needs attention, what the work touches, the live feed */
.rail { position: fixed; top: 0; right: 0; bottom: 0; width: var(--rail); z-index: 22; display: none; flex-direction: column; background: var(--side); border-left: 1px solid var(--border-hi); }
body.has-rail .rail { display: flex; }
.r-alerts { flex: none; }
.r-alerts .alerts { position: relative; z-index: auto; top: auto; right: auto; width: auto; border-radius: 0; border: 0; border-bottom: 1px solid var(--border); box-shadow: none; backdrop-filter: none; background: rgba(60, 12, 24, .16); transition: none; }
body.panel-open .r-alerts .alerts { right: auto; }
.r-alerts .alerts.closed { width: auto; }
.r-alerts .al-list { max-height: 30vh; }
.r-sec { display: flex; flex-direction: column; min-height: 0; }
.r-touch { flex: 1 1 58%; border-bottom: 1px solid var(--border); }
.r-feed { flex: 1 1 42%; }
.r-head { flex: none; display: flex; align-items: baseline; gap: 9px; padding: 12px 14px 7px; }
.r-sub { min-width: 0; font-size: 11.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.r-sub b { font: 600 11.5px var(--mono); color: var(--text-2); }
.r-pill { margin-left: auto; height: 20px; padding: 0 8px; border-radius: 999px; border: 0; background: rgba(96, 165, 250, .2); color: #bcd7fd; font-size: 11px; font-weight: 600; cursor: pointer; }
.r-tabs { flex: none; display: flex; gap: 2px; padding: 0 9px 7px; overflow: hidden; }
.r-tabs button { flex: none; height: 24px; padding: 0 8px; display: flex; align-items: center; gap: 5px; border-radius: 6px; border: 0; background: none; color: var(--text-3); font-size: 11.5px; cursor: pointer; }
.r-tabs button b { font: 500 10.5px var(--mono); }
.r-tabs button:hover { color: var(--text-2); }
.r-tabs button[aria-pressed="true"] { background: rgba(148, 163, 184, .13); color: var(--text); }
.r-list { flex: 1 1 auto; min-height: 0; list-style: none; margin: 0; padding: 0 6px 8px; overflow-y: auto; }
.r-empty { padding: 14px 10px; color: var(--text-3); font-size: 12px; }
.tr { position: relative; display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 9px; align-items: center; padding: 6px 8px 6px 10px; border-radius: 8px; cursor: pointer; }
.tr::before { content: ''; position: absolute; left: 2px; top: 9px; bottom: 9px; width: 2px; border-radius: 2px; background: var(--kc); opacity: .75; }
.tr:hover, .tr.lit, .tr.wired { background: rgba(255, 255, 255, .05); }
.tr.lit, .tr.wired { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--kc) 45%, transparent); }
.tr.sel { background: rgba(96, 165, 250, .12); }
.tr.hit, .fr.hit { animation: rowHit .7s ease-out; }
.tg { width: 16px; height: 16px; color: var(--text-3); }
.tg svg { width: 16px; height: 16px; display: block; }
.tr.live .tg { color: var(--kc); animation: livePulse 1.4s ease-in-out infinite; }
.tm { min-width: 0; }
.tn { display: flex; gap: 7px; align-items: baseline; min-width: 0; }
.tn b { flex: 0 1 auto; min-width: 0; font-weight: 600; font-size: 12.5px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tn span { flex: 1 1 0; min-width: 0; font-size: 11px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tw { display: flex; gap: 4px; margin-top: 3px; min-width: 0; overflow: hidden; }
.sc, .flag { flex: none; font-size: 10.5px; line-height: 17px; padding: 0 6px; border-radius: 999px; white-space: nowrap; }
.sc { flex: 0 1 auto; min-width: 52px; max-width: 132px; overflow: hidden; text-overflow: ellipsis; background: rgba(148, 163, 184, .1); color: var(--text-2); }
.sc.extra { min-width: 0; flex: none; }
.flag { background: rgba(96, 165, 250, .13); color: #a9cdfc; }
.flag.hot { background: rgba(251, 146, 60, .2); color: #ffc79b; }
.flag.bad { background: rgba(244, 63, 94, .16); color: #ff9fb0; }
.ts { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.strip { display: block; width: 72px; height: 14px; border-radius: 3px; background: rgba(148, 163, 184, .06); }
.tc { display: flex; gap: 6px; align-items: baseline; font-size: 10.5px; color: var(--text-3); white-space: nowrap; }
.tc b { font: 600 11px var(--mono); color: var(--text-2); }
.fr { position: relative; display: grid; grid-template-columns: 64px 3px minmax(0, 1fr) 14px; gap: 8px; align-items: start; padding: 5px 8px; border-radius: 7px; cursor: pointer; }
.fr:hover { background: rgba(255, 255, 255, .05); }
.fr.in { animation: feedIn .55s cubic-bezier(.2, .8, .2, 1); }
.ft { font: 10.5px/17px var(--mono); color: var(--text-3); }
.fk { align-self: stretch; margin: 3px 0; border-radius: 2px; background: var(--kc); }
.fm { min-width: 0; }
.fl { font-size: 12px; line-height: 17px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fr.failed .fl { color: #ffc2cc; }
.fw { font-size: 11px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fw .who-s { color: var(--text-2); }
.fres { margin-left: 7px; font-family: var(--mono); font-size: 10.5px; }
.fres::before { content: '→ '; }
.fs { font-size: 11px; line-height: 17px; text-align: center; }
.fs.ok { color: var(--work); }
.fs.bad { color: var(--bad); font-weight: 700; }
.fs.cut { color: var(--warn); }
.fs.open i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--wait); border-right-color: transparent; animation: spin .8s linear infinite; vertical-align: -1px; }

/* wires from a card to what it touches */
.wires { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; z-index: 24; pointer-events: none; overflow: visible; }
.wire { fill: none; stroke: var(--kc); stroke-width: 1.6; stroke-opacity: .8; stroke-dasharray: 5 7; animation: wireFlow .9s linear infinite; filter: drop-shadow(0 0 3px var(--kc)); }
.wire-end { fill: var(--kc); }
.trail { fill: none; stroke: var(--kc); stroke-width: 2; stroke-linecap: round; }
.pk { fill: var(--kc); filter: drop-shadow(0 0 6px var(--kc)); }

/* panel: activity, what it touched, what failed */
.p-path { margin: -2px 0 6px; font: 11.5px/1.45 var(--mono); color: var(--text-2); word-break: break-all; }
.p-strip .strip { width: 100%; height: 30px; }
.p-axis { display: flex; justify-content: space-between; margin-top: 3px; font: 10.5px var(--mono); color: var(--text-3); }
.kbar { display: flex; gap: 2px; height: 8px; margin: 12px 0 8px; }
.kbar i { min-width: 3px; border-radius: 2px; }
.klegend { list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 4px 14px; margin: 0 0 12px; padding: 0; font-size: 12px; color: var(--text-2); }
.klegend li { display: flex; align-items: center; gap: 6px; }
.klegend b { margin-left: auto; font: 600 11.5px var(--mono); color: var(--text); }
.klegend li > span:last-child { width: 30px; text-align: right; font: 11px var(--mono); color: var(--text-3); }
.bad-t { color: #ff9fb0; }
.p-res, .p-fails, .p-touches { list-style: none; margin: 0; padding: 0; }
.p-res li { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 5px 6px; border-radius: 7px; cursor: pointer; }
.p-who li { grid-template-columns: minmax(0, 1fr) auto; }
.p-res li:hover, .p-touches li:hover { background: rgba(255, 255, 255, .04); }
.p-res li[data-gone], .p-touches li[data-gone] { opacity: .55; cursor: default; }
.p-res li[data-gone]:hover, .p-touches li[data-gone]:hover { background: none; }
.p-res .nm { display: flex; gap: 7px; align-items: baseline; min-width: 0; }
.p-res .nm b { flex: 0 1 auto; min-width: 0; font-weight: 600; font-size: 12.5px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-res .nm span { flex: 1 1 0; min-width: 0; font-size: 11px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kds { display: flex; gap: 4px; }
.kd { font: 600 10.5px/17px var(--mono); padding: 0 5px; border-radius: 5px; color: var(--text); background: color-mix(in srgb, var(--kc) 28%, transparent); }
.kd.bad { background: rgba(244, 63, 94, .2); color: #ff9fb0; }
.p-fails li { padding: 6px 0; border-bottom: 1px solid rgba(148, 163, 184, .07); }
.p-fails .fh { font-size: 12.5px; color: var(--text); }
.p-fails .t { margin-right: 8px; font: 11px var(--mono); color: var(--text-3); }
.p-fails .fe { margin-top: 4px; padding: 5px 7px; border-radius: 6px; background: rgba(244, 63, 94, .08); color: #ffc2cc; font: 11.5px/1.4 var(--mono); word-break: break-word; }
.p-touches li { display: grid; grid-template-columns: 66px 3px minmax(0, 1fr) 14px; gap: 8px; align-items: start; padding: 4px; border-radius: 6px; cursor: pointer; font-size: 12px; }
.p-touches .t { font: 10.5px/17px var(--mono); color: var(--text-3); }
.p-touches .lb { color: var(--text); word-break: break-word; line-height: 17px; }
.p-touches .lb small { display: block; color: var(--text-3); font-size: 11px; }

/* usage panel */
.u-note { margin: 8px 0 0; font-size: 11.5px; color: var(--text-3); }
.u-stale { color: var(--turn); }
.u-dim { margin-top: 4px; font-size: 11.5px; color: var(--text-3); }
.u-warn { margin-top: 4px; font-size: 11.5px; color: #ffb4c0; }
.u-warn code { font: 11px var(--mono); padding: 0 4px; border-radius: 4px; background: rgba(244, 63, 94, .14); }
.u-accs { display: grid; gap: 6px; }
.u-acc { padding: 8px 10px; border-radius: 9px; border: 1px solid var(--border); background: rgba(255, 255, 255, .015); }
.u-acc.on { border-color: rgba(52, 211, 153, .4); background: rgba(52, 211, 153, .05); }
.u-acc.off { opacity: .7; }
.u-who { display: flex; gap: 8px; align-items: baseline; min-width: 0; font-size: 12.5px; }
.u-who b { font: 600 12px var(--mono); color: var(--text-2); }
.u-who .em { flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
.u-badge { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--work); }
.u-wins { display: grid; gap: 3px; margin-top: 6px; }
.u-win { display: grid; grid-template-columns: 52px minmax(0, 1fr) 38px 58px; gap: 8px; align-items: center; font: 11px var(--mono); color: var(--text-2); }
.u-win .wl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-3); }
.u-win .wb { height: 6px; border-radius: 3px; background: rgba(148, 163, 184, .12); overflow: hidden; }
.u-win .wb i { display: block; height: 100%; border-radius: 3px; min-width: 2px; }
.u-win .wp { text-align: right; color: var(--text); }
.u-win .wr { text-align: right; color: var(--text-3); }
.u-seg { display: flex; flex-wrap: wrap; gap: 0; margin: 2px 0 10px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; width: max-content; max-width: 100%; }
.u-seg button { padding: 4px 10px; border: 0; background: none; cursor: pointer; font-size: 12px; color: var(--text-2); }
.u-seg button + button { border-left: 1px solid var(--border); }
.u-seg button:hover { color: var(--text); background: rgba(255, 255, 255, .04); }
.u-seg button[aria-pressed="true"] { color: var(--text); background: rgba(96, 165, 250, .16); }
.u-seg button:focus-visible { outline: 2px solid var(--wait); outline-offset: -2px; }
.u-tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.u-tile { padding: 7px 9px; border-radius: 8px; border: 1px solid var(--border); background: rgba(255, 255, 255, .02); min-width: 0; }
.u-tile span { display: block; font-size: 10.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.u-tile b { display: block; margin-top: 1px; font: 600 16px/1.2 var(--mono); color: var(--text); }
.u-chart { position: relative; margin-top: 12px; }
.u-svg { display: block; max-width: 100%; height: auto; overflow: visible; }
.u-svg .gl { stroke: rgba(148, 163, 184, .1); stroke-width: 1; }
.u-svg .ax { fill: var(--text-3); font: 10px var(--mono); }
.u-svg .hit { fill: transparent; cursor: crosshair; }
.u-svg .hit:hover { fill: rgba(255, 255, 255, .05); }
.u-tip { position: absolute; top: -6px; transform: translateY(-100%); display: flex; flex-direction: column; gap: 1px; padding: 6px 9px; border-radius: 8px; border: 1px solid var(--border-hi); background: #0b1324; box-shadow: 0 8px 24px rgba(0, 0, 0, .45); font-size: 11.5px; color: var(--text-2); pointer-events: none; white-space: nowrap; z-index: 2; }
.u-tip b { color: var(--text); font-weight: 600; }
.u-tip .tt { color: var(--text); font-family: var(--mono); }
.u-tip i, .u-legend i, .u-table .nm i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: 0; }
.u-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 6px 0 10px; font-size: 11.5px; color: var(--text-2); }
.u-table { display: grid; grid-template-columns: minmax(0, 1.6fr) repeat(5, minmax(0, 1fr)); gap: 4px 8px; font: 11.5px var(--mono); color: var(--text-2); }
.u-table span { text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.u-table .hd { font: 600 10px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); }
.u-table .nm, .u-table .hd:first-child { text-align: left; color: var(--text); font-family: var(--sans); }
.u-rows { list-style: none; margin: 0; padding: 0; }
.u-rows li { display: grid; grid-template-columns: minmax(0, 1fr) 72px 52px; gap: 10px; align-items: center; padding: 5px 6px; border-radius: 7px; }
.u-rows li[data-focus] { cursor: pointer; }
.u-rows li[data-focus]:hover { background: rgba(255, 255, 255, .04); }
.u-rows .nm { display: flex; flex-direction: column; min-width: 0; }
.u-rows .nm b { font-weight: 600; font-size: 12.5px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.u-rows .nm span { font-size: 11px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.u-rows .v { text-align: right; font: 11.5px var(--mono); color: var(--text); }
.u-bar { height: 5px; border-radius: 3px; background: rgba(148, 163, 184, .1); overflow: hidden; }
.u-bar i { display: block; height: 100%; border-radius: 3px; background: var(--wait); min-width: 2px; }

@keyframes livePulse { 50% { opacity: .45; } }
@keyframes wireFlow { to { stroke-dashoffset: -12; } }
@keyframes feedIn { from { opacity: 0; transform: translateX(14px); background: color-mix(in srgb, var(--kc) 22%, transparent); } }
@keyframes rowHit { 0% { background: color-mix(in srgb, var(--kc) 30%, transparent); } }
/* the dock narrows when a panel opens, so its header follows the dock's width, not the window's */
.dock { container-type: inline-size; }
@container (max-width: 1150px) { .kinds button span { display: none; } .kinds button { padding: 0 7px; } }
@container (max-width: 860px) { .dock-head h2, .tl-rate span:not(.bad) { display: none; } .dock-head { gap: 7px; padding-left: 12px; } }
@container (max-width: 560px) { .kinds { display: none; } }

@media (max-width: 640px) {
  .hud { max-width: calc(100vw - 32px); bottom: calc(var(--dock) + 54px); }
  .banner { max-width: calc(100vw - 32px); top: auto; bottom: calc(var(--dock) + 94px); }
  body.panel-open .alerts { display: none; }
  .al-list { max-height: 30vh; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<div class="viewport" id="viewport" role="main"><div class="world" id="world"></div></div>
<div class="empty" id="empty" hidden>No Claude sessions are running.</div>
<div class="float banner" id="banner" hidden></div>
<section class="float alerts" id="alerts" hidden></section>
<div class="float hud" id="hud"><span class="mark off" id="mark"></span><span id="hud-text">Connecting…</span></div>
<div class="float ctrl" id="ctrl">
  <button type="button" id="usage-btn" aria-pressed="false" title="Usage: tokens and account limits (U)">Usage</button>
  <button type="button" id="only-active" aria-pressed="false" title="Hide finished agents, shells and workflows">Active only</button>
  <div class="grp"><button type="button" id="zoom-out" title="Zoom out (Ctrl + − or Ctrl + scroll)" aria-label="Zoom out">−</button><button type="button" id="zoom-pct" class="pct" title="Full size (0)">100%</button><button type="button" id="zoom-in" title="Zoom in (Ctrl + = or Ctrl + scroll)" aria-label="Zoom in">+</button></div>
  <button type="button" id="fit" aria-pressed="false" title="Show everything on one screen (F)">Fit</button>
</div>
<aside class="rail" id="rail" aria-label="What the sessions are touching">
  <div class="r-alerts" id="r-alerts"></div>
  <section class="r-sec r-touch">
    <header class="r-head"><h2>Touching</h2><span class="r-sub" id="touch-sub"></span></header>
    <div class="r-tabs" id="touch-tabs"></div>
    <ul class="r-list" id="touch-list"></ul>
  </section>
  <section class="r-sec r-feed">
    <header class="r-head"><h2>Live</h2><span class="r-sub" id="feed-sub"></span><button type="button" class="r-pill" id="feed-new" hidden></button></header>
    <ol class="r-list" id="feed"></ol>
  </section>
</aside>
<section class="dock" id="dock" aria-label="Timeline">
  <div class="dock-grip" id="dock-grip" title="Drag to resize · double-click to fold"></div>
  <header class="dock-head">
    <h2>Timeline</h2>
    <div class="seg" id="tl-range"><button type="button" data-span="15m">15m</button><button type="button" data-span="1h">1h</button><button type="button" data-span="3h">3h</button></div>
    <button type="button" class="live-btn" id="tl-live" aria-pressed="true">Live</button>
    <div class="kinds" id="tl-kinds"></div>
    <div class="tl-rate" id="tl-rate"></div>
    <button type="button" class="fold" id="dock-fold" aria-expanded="true" aria-label="Fold the timeline">▼</button>
  </header>
  <div class="tl" id="tl"><canvas id="tl-canvas"></canvas><div class="tl-empty" id="tl-empty" hidden>No tool calls in this window yet.</div><div class="tl-tip" id="tl-tip" hidden></div></div>
</section>
<svg class="wires" id="wires" aria-hidden="true"><g class="w-hover"></g><g class="w-pk"></g></svg>
<aside class="panel" id="panel" aria-live="polite"></aside>
<div class="toasts" id="toasts"></div>
<script src="/vendor/d3.min.js"></script>
<script src="/map.js"></script>
<script src="/live.js"></script>
<script src="/usage-ui.js"></script>
</body>
</html>
