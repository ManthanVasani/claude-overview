name: Feature request
description: Something the board could show or do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The situation, and what the board does not help with today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: What you would like the board to show or do.
    validations:
      required: true
  - type: textarea
    id: else
    attributes:
      label: Anything else
      description: Other ways you have tried, or other tools that do it.
