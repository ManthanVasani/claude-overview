name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # lsof for the board's macOS process path, libbsd for the check against the C library's strvis
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libbsd-dev lsof
      - run: npm test
